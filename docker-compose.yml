version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: almawasim-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: almawasim_db
    ports:
      - "5432:5432"
    volumes:
      - almawasim_pgdata:/var/lib/postgresql/data

volumes:
  almawasim_pgdata: