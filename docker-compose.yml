services:
  postgres:
    image: postgres:15-alpine
    container_name: almawasim-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: almawasim_db

    ports:
      - "5432:5432"

    volumes:
      - almawasim_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d almawasim_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  almawasim_pgdata: